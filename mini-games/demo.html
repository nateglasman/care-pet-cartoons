<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet Care Demo</title>
<link rel="stylesheet" href="bath/bath.css">
<link rel="stylesheet" href="walk/walk.css">
<link rel="stylesheet" href="fetch/fetch.css">
<link rel="stylesheet" href="feed/feed.css">
<link rel="stylesheet" href="streak/streak.css">
<style>
  body { margin: 0; padding: 24px 16px; font: 15px/1.45 system-ui, sans-serif; background: #f6f4ef; color: #1f1d1a; }
  .card { max-width: 340px; margin: 0 auto; background: #fff; border: 1px solid #e6e1d8; border-radius: 14px; padding: 16px; text-align: center; }
  .token { width: 200px; height: 200px; border-radius: 50%; margin: 0 auto 10px; display: grid; place-items: center;
           background: radial-gradient(circle at 35% 30%, #fff1c2, #f3c64f 45%, #c99324 100%); box-shadow: inset 0 0 0 7px #d9a93a, inset 0 0 0 9px #fff0b5, 0 8px 18px rgba(0,0,0,.25); }
  .token img { width: 85%; height: 85%; object-fit: contain; }
  .pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #eee; }
  .pill[hidden] { display: none; }
  .games { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  p { color: #6b665e; font-size: 13px; }
  #log { text-align: left; font: 12px/1.4 ui-monospace, monospace; color: #6b665e; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="card">
  <div class="token streak-self" data-streak-id="CAIL-A-50367" data-id="CAIL-A-50367" data-name="Vera"><img src="../data/cartoons/CAIL-A-50367.webp" alt="Vera"></div>
  <div><span data-streak-chip="CAIL-A-50367"></span> &nbsp;⭐ <b data-streak-xp>0</b> XP</div>
  <h2 style="margin:4px 0">Vera
    <span class="pill bathed" hidden>🫧 bathed</span><span class="pill walked" hidden>🐾 walked</span>
    <span class="pill played" hidden>🎾 played</span><span class="pill fed" hidden>🥣 fed</span>
  </h2>
  <p>Four care games on one token. Finish all four today and the token turns Shiny Gold (see <code>streak/</code>). Completion is remembered in this browser.</p>
  <div class="games">
    <button class="bath-btn"  data-id="CAIL-A-50367" data-name="Vera" data-src="../data/cartoons/CAIL-A-50367.webp">🛁 Give a bath</button>
    <button class="walk-btn"  data-id="CAIL-A-50367" data-name="Vera" data-src="../data/cartoons/CAIL-A-50367.webp">🦮 Walk</button>
    <button class="fetch-btn" data-id="CAIL-A-50367" data-name="Vera" data-src="../data/cartoons/CAIL-A-50367.webp">🎾 Play fetch</button>
    <button class="feed-btn"  data-id="CAIL-A-50367" data-name="Vera" data-src="../data/cartoons/CAIL-A-50367.webp" data-species="Dog" data-size-label="Mixed Breed (Large)">🥣 Feed</button>
  </div>
  <p><a href="#" id="reset">reset all</a></p>
  <div id="log"></div>
</div>
<script src="bath/bath.js"></script>
<script src="walk/walk.js"></script>
<script src="fetch/fetch.js"></script>
<script src="feed/feed.js"></script>
<script src="streak/streak.js"></script>
<script>
  document.getElementById('reset').addEventListener('click', (e) => { e.preventDefault(); [BathGame, WalkGame, FetchGame, FeedGame].forEach(g => g.reset()); });
document.getElementById('reset').addEventListener('click', () => Streak.reset());
</script>
</body>
</html>
