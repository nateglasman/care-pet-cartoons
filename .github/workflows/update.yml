# Keeps the GitHub Pages demo in sync with the shelter's adoptable list.
#
# Every run: pull the current list from Shelterluv -> analyze only NEW pets
# (cached results live in data/ and are committed back here, so nothing is
# re-paid) -> drop pets that left -> rebuild the static site -> deploy Pages.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   ANTHROPIC_API_KEY   breed identification (required for real results)
#   OPENAI_API_KEY      cartoons (default provider)
#   GEMINI_API_KEY      only if you set the CARTOON_PROVIDER variable to "gemini"
# With no ANTHROPIC_API_KEY the site still builds, in clearly-labelled preview mode.
name: Update pets and deploy

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sync shelter list, analyze new pets, prune, build site
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CARTOON_PROVIDER: ${{ vars.CARTOON_PROVIDER }}
          CARTOON_MODEL: ${{ vars.CARTOON_MODEL }}
          CARTOON_STYLE: ${{ vars.CARTOON_STYLE }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret not set - building in preview (mock) mode"
            export MOCK_AI=1
          fi
          python -m app.pipeline --sync --prune
          python -m app.site

      - name: Commit refreshed data back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore: refresh shelter data $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
